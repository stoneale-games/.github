name: ✨ Feature request
description: Suggest an idea or improvement for Stoneale
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and who is it for (players, contributors, operators)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mention any Stellar or Soroban specifics, such as new contract functions or wallet flows.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This does not put mood, journal or other health data on-chain
          required: true
